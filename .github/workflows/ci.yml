name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build novac
        run: |
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Isrc src/lexer.cpp src/ast.cpp src/parser.cpp src/scope.cpp src/modules.cpp src/semantic.cpp src/codegen.cpp src/main.cpp -o build/novac
      - name: Unit tests
        run: |
          FRONT="src/lexer.cpp src/ast.cpp src/parser.cpp"
          SEMA="$FRONT src/scope.cpp src/modules.cpp src/semantic.cpp"
          FULL="$SEMA src/codegen.cpp"
          g++ -std=c++20 -Isrc $FRONT tests/test_parser.cpp -o build/test_parser
          g++ -std=c++20 -Isrc $SEMA tests/test_semantic.cpp -o build/test_semantic
          g++ -std=c++20 -Isrc $FULL tests/test_codegen.cpp -o build/test_codegen
          ./build/test_parser && ./build/test_semantic && ./build/test_codegen
      - name: End-to-end examples
        run: |
          g++ -std=c++20 tests/test_examples.cpp -o build/test_examples
          ./build/test_examples
